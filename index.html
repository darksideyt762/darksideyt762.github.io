<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Quran Player</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:700px;
background:#1e293b;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{
margin-bottom:10px;
}

p{
opacity:.8;
}

button{
margin-top:20px;
padding:15px 30px;
font-size:18px;
border:none;
border-radius:999px;
background:#10b981;
color:white;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.status{
margin-top:20px;
font-size:15px;
color:#94a3b8;
}

.heard{
margin-top:15px;
font-size:18px;
}

.arabic{
margin-top:25px;
font-size:32px;
line-height:2;
direction:rtl;
}

.info{
margin-top:10px;
font-size:16px;
}

audio{
width:100%;
margin-top:20px;
}
</style>
</head>
<body>

<div class="card">

<h1>🎤 Voice Quran Player</h1>

<p>Example: Play Surah Yaseen verse 10</p>

<button id="micBtn">Start Listening</button>

<div class="status" id="status">
Ready
</div>

<div class="heard" id="heard"></div>

<div class="info" id="info"></div>

<div class="arabic" id="arabic"></div>

<audio id="audio" controls></audio>

</div>

<script>

const statusEl=document.getElementById("status");
const heardEl=document.getElementById("heard");
const infoEl=document.getElementById("info");
const arabicEl=document.getElementById("arabic");
const audioEl=document.getElementById("audio");

const surahs={
fatiha:1,
baqarah:2,
imran:3,
nisa:4,
maidah:5,
anam:6,
araf:7,
anfal:8,
tawbah:9,
yunus:10,
hud:11,
yusuf:12,
kahf:18,
yaseen:36,
rahman:55,
waqiah:56,
mulk:67,
ikhlas:112,
falaq:113,
nas:114
};

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

statusEl.innerHTML=
"❌ Speech Recognition not supported by this browser.<br><br>Use latest Google Chrome.";

}else{

const recognition=
new SpeechRecognition();

recognition.lang="en-US";
recognition.interimResults=false;
recognition.continuous=false;

document
.getElementById("micBtn")
.addEventListener("click",async()=>{

try{

await navigator.mediaDevices.getUserMedia({
audio:true
});

recognition.start();

}catch(err){

statusEl.innerHTML=
"❌ Microphone permission denied";

}

});

recognition.onstart=()=>{
statusEl.innerHTML="🎤 Listening...";
};

recognition.onend=()=>{
statusEl.innerHTML="✅ Finished listening";
};

recognition.onerror=(event)=>{

statusEl.innerHTML=
"❌ Error: "+event.error;

console.log(event);

};

recognition.onresult=(event)=>{

const text=
event.results[0][0].transcript
.toLowerCase();

heardEl.innerHTML=
"<b>You said:</b> "+text;

parseCommand(text);

};

async function parseCommand(text){

let surahName=null;

for(let name in surahs){

if(text.includes(name)){

surahName=name;
break;

}

}

const match=
text.match(/verse\s+(\d+)/i)||
text.match(/ayah\s+(\d+)/i);

if(!surahName||!match){

statusEl.innerHTML=
"❌ Say: Play Surah Yaseen verse 10";

return;

}

const surahNumber=
surahs[surahName];

const ayahNumber=
match[1];

statusEl.innerHTML=
"📖 Loading verse...";

try{

const response=
await fetch(
`https://api.alquran.cloud/v1/ayah/${surahNumber}:${ayahNumber}/ar.alafasy`
);

const data=
await response.json();

arabicEl.innerHTML=
data.data.text||"";

infoEl.innerHTML=
`Surah ${surahName.toUpperCase()} - Verse ${ayahNumber}`;

if(data.data.audio){

audioEl.src=
data.data.audio;

audioEl.play();

statusEl.innerHTML=
"🔊 Playing recitation";

}else{

statusEl.innerHTML=
"⚠ Audio unavailable";

}

}catch(err){

console.log(err);

statusEl.innerHTML=
"❌ Failed to fetch verse";

}

}

}
</script>

</body>
</html>
