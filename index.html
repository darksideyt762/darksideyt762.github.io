<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Quran Player</title>
    
    <!-- Google Fonts for English and Arabic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="app-container">
        <!-- Header Section -->
        <header>
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
                <h1>Voice Quran</h1>
            </div>
            
            <div class="settings">
                <select id="reciter-select" class="glass-select">
                    <option value="ar.alafasy">Mishary Rashid Alafasy</option>
                    <option value="ar.abdulbasitmurattal">Abdul Basit (Murattal)</option>
                    <option value="ar.mahermuaiqly">Maher Al Muaiqly</option>
                    <option value="ar.hudhaify">Ali Al-Hudhaify</option>
                </select>
            </div>
        </header>

        <!-- Voice Control Section -->
        <main class="main-content">
            <div class="mic-container">
                <button id="mic-btn" class="mic-button glass-panel" aria-label="Microphone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" x2="12" y1="19" y2="22"/>
                    </svg>
                </button>
                <div class="status-indicator">
                    <span id="status-dot" class="dot"></span>
                    <span id="status-text">Click mic to start listening</span>
                </div>
                <div id="transcript" class="transcript-text">Try saying: "Play Surah Yaseen verse 10"</div>
            </div>

            <!-- Quran Display Area -->
            <div class="quran-display glass-panel">
                <div class="surah-info">
                    <span id="surah-name">Al-Fatihah</span>
                    <span class="badge">Verse <span id="verse-number">1</span></span>
                </div>
                
                <div class="verse-container">
                    <!-- Loading Indicator -->
                    <div id="loading-spinner" class="loader hidden"></div>
                    
                    <div id="arabic-text" class="arabic-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                    <div id="translation-text" class="translation-text">In the name of God, The Most Gracious, The Dispenser of Grace.</div>
                </div>
            </div>

            <!-- Audio Player Controls -->
            <div class="player-controls glass-panel">
                <div class="progress-container">
                    <span id="time-current" class="time-label">0:00</span>
                    <input type="range" id="seek-bar" value="0" min="0" max="100" step="1">
                    <span id="time-total" class="time-label">0:00</span>
                </div>

                <div class="control-buttons">
                    <button id="btn-repeat" class="icon-btn" title="Repeat Verse">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                    </button>
                    <button id="btn-prev" class="icon-btn" title="Previous Verse">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
                    </button>
                    <button id="btn-play-pause" class="play-btn" title="Play/Pause">
                        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button id="btn-next" class="icon-btn" title="Next Verse">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                    </button>
                    <button id="btn-stop" class="icon-btn" title="Stop">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
                    </button>
                </div>
                
                <div class="volume-container">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="volume-icon"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </main>
    </div>

    <!-- Error/Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
