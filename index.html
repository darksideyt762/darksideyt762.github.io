<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Quran Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:90%;
    max-width:700px;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

h1{
    margin-bottom:15px;
}

button{
    border:none;
    background:#10b981;
    color:white;
    padding:15px 30px;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    opacity:.9;
}

#status{
    margin-top:20px;
    color:#94a3b8;
}

#heard{
    margin-top:15px;
    font-size:18px;
}

#result{
    margin-top:20px;
    line-height:1.8;
}
</style>
</head>
<body>

<div class="card">
    <h1>🎤 Voice Quran Player</h1>

    <p>Say:</p>
    <p><b>"Play Surah Yaseen verse 10"</b></p>

    <button id="micBtn">Start Listening</button>

    <div id="status">Ready</div>
    <div id="heard"></div>

    <div id="result"></div>

    <audio id="player" controls style="width:100%;margin-top:20px;"></audio>
</div>

<script>

const surahs = {
    fatiha:1,
    baqarah:2,
    imran:3,
    nisa:4,
    maidah:5,
    anam:6,
    araf:7,
    anfal:8,
    tawbah:9,
    yunus:10,
    hud:11,
    yusuf:12,
    rahman:55,
    waqiah:56,
    mulk:67,
    yaseen:36,
    kahf:18,
    ikhlas:112,
    falaq:113,
    nas:114
};

const statusEl = document.getElementById("status");
const heardEl = document.getElementById("heard");
const resultEl = document.getElementById("result");
const player = document.getElementById("player");

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
    statusEl.innerText =
    "Speech Recognition not supported.";
}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = false;
recognition.interimResults = false;

document.getElementById("micBtn").onclick = () => {
    statusEl.innerText = "Listening...";
    recognition.start();
};

recognition.onresult = async (event) => {

    const text =
    event.results[0][0].transcript.toLowerCase();

    heardEl.innerHTML =
    "<b>You said:</b> " + text;

    statusEl.innerText = "Processing...";

    parseCommand(text);
};

recognition.onerror = () => {
    statusEl.innerText = "Voice recognition failed";
};

async function parseCommand(text){

    let foundSurah = null;

    for(const name in surahs){
        if(text.includes(name)){
            foundSurah = name;
            break;
        }
    }

    const verseMatch =
    text.match(/verse\s+(\d+)/) ||
    text.match(/ayah\s+(\d+)/);

    if(!foundSurah || !verseMatch){

        statusEl.innerText =
        "Try: Play Surah Yaseen verse 10";

        return;
    }

    const surahNumber = surahs[foundSurah];
    const ayahNumber = verseMatch[1];

    try{

        const url =
        `https://api.alquran.cloud/v1/ayah/${surahNumber}:${ayahNumber}/ar.alafasy`;

        const response = await fetch(url);
        const data = await response.json();

        resultEl.innerHTML = `
        <h3>Surah ${foundSurah.toUpperCase()}</h3>
        <p>Ayah ${ayahNumber}</p>
        `;

        player.src = data.data.audio;
        player.play();

        statusEl.innerText =
        "Playing recitation";

    }catch(err){

        console.log(err);

        statusEl.innerText =
        "Unable to fetch verse";

    }
}
</script>

</body>
</html>
